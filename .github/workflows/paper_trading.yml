name: ペーパートレード(Binance Testnet)

# 【スケジュール実行は無効化済み(2026-08-14)】GitHub Actionsのランナーは米国IPのため、
# Binanceが一律ブロックしており(HTTP 451、実測で確認済み)、cronで自動実行しても必ず
# 失敗する。実際の実行はローカルPCのタスクスケジューラ(paper_trading/run_cycle_task.ps1、
# 15分おき)で行っている。将来、米国以外のセルフホストランナー等が使えるようになったら
# schedule行を復活させる。workflow_dispatchは検証用に残す(手動実行も同じ理由で失敗するが、
# 挙動を再確認したい時のため)。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 依存関係インストール
        run: pip install -r requirements.txt

      - name: ペーパートレード1サイクル実行
        env:
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
        run: python -m paper_trading.run_cycle

      - name: クラウド公開用スナップショットを更新
        run: cp data/paper_trading.db data/paper_trading_cloud.db

      - name: スナップショットをコミット&プッシュ(ダッシュボード用)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper_trading_cloud.db
          git diff --cached --quiet && echo "変更なし" || git commit -m "chore: ペーパートレード履歴更新 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
